<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歌手与专辑 · 交互原型</title>
<style>
:root{--g:#08b884;--ink:#172b28;--muted:#7c8d87;--bg:#f7faf8}*{box-sizing:border-box}body{margin:0;background:#edf3ef;color:var(--ink);font:14px/1.5 'Segoe UI','Microsoft YaHei',sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--g);outline-offset:3px}.board{max-width:1320px;margin:auto;padding:30px}h1{font-size:24px;margin:0}header p{color:var(--muted);margin:7px 0 22px}.layout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}.caption{margin:0 0 12px;font-weight:600}.caption small{color:var(--muted);font-weight:400;display:block;margin-top:4px}.phone{height:790px;background:var(--bg);border:1px solid #d8e3dc;border-radius:28px;overflow:hidden;box-shadow:0 16px 40px #234b3010;display:flex;flex-direction:column;position:relative}.status{padding:10px 20px 4px;font-size:11px;display:flex;justify-content:space-between;font-weight:600}.top{display:flex;align-items:center;gap:8px;padding:9px 14px}.search{background:white;border-radius:24px;height:40px;display:flex;align-items:center;padding:0 12px;gap:8px;flex:1;min-width:0}.search input{border:0;outline:0;width:100%;min-width:0;background:transparent}.kind{position:relative}.kind>button,.primary{background:var(--g);color:white;border-radius:12px;padding:10px 13px;font-weight:600}.menu{position:absolute;right:0;top:46px;z-index:10;width:138px;padding:7px;background:white;border:1px solid #e0ebe5;box-shadow:0 8px 25px #173a2520;border-radius:15px}.menu button{display:block;text-align:left;width:100%;padding:11px;border-radius:9px}.menu .active{background:var(--g);color:white}.platforms{display:flex;gap:7px;padding:3px 14px 10px}.platforms button{flex:1;border:1px solid #c6d5cc;border-radius:9px;background:white;padding:7px 0;font-size:12px}.platforms .active{background:#d5eee2;border-color:#d5eee2;color:#175e47}.count{font-size:11px;color:var(--muted);padding:5px 16px 12px}.scroll{flex:1;overflow:auto;min-height:0;scrollbar-width:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px 20px}.card{position:relative;background:white;border:1px solid #e8efea;border-radius:17px;padding:12px;text-align:left;min-width:0}.card.artist{text-align:center;padding-top:18px}.art{background:var(--cover);position:relative;overflow:hidden;color:white;display:grid;place-items:center;isolation:isolate}.art:before{content:'';position:absolute;width:135%;height:60%;background:#ffffff18;transform:rotate(-32deg);bottom:-10%;z-index:-1}.art:after{content:'';position:absolute;width:60%;height:120%;border:1px solid #ffffff25;transform:rotate(25deg);right:10%;z-index:-1}.art span{font-size:25px;letter-spacing:3px;font-weight:300}.card .art{aspect-ratio:1;border-radius:11px;width:100%}.card.artist .art{width:98px;height:98px;max-width:100%;border-radius:50%;margin:0 auto 12px}.card b{display:block;margin-top:8px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.muted{color:var(--muted);font-size:11px}.badge{display:inline-block;background:#fce7eb;color:#c44a61;font-size:10px;padding:1px 5px;border-radius:4px;margin-right:5px}.meta{margin-top:9px;font-size:10px;color:var(--muted)}.heart{position:absolute;right:7px;top:7px;background:white;border:1px solid #e6eee8;border-radius:50%;height:30px;width:30px;color:#7c8d87;z-index:2;font-size:17px}.heart.on{background:#fff0f4;color:#ec5277;border-color:#ffdce6}.mini{margin:5px 12px 8px;background:#fff;border:1px solid #e0eae4;border-radius:15px;padding:9px;display:flex;align-items:center;gap:9px;flex:none}.mini .art{width:38px;height:38px;border-radius:9px}.mini b{font-size:12px}.mini .title{flex:1}.mini button{font-size:22px;padding:0 6px}.nav{height:65px;background:white;display:flex;justify-content:space-around;padding:8px 0;font-size:11px;flex:none}.nav button{color:var(--muted);min-width:65px}.nav i{display:block;font-style:normal;font-size:20px;line-height:25px}.nav .selected{color:#087653}.nav .selected i{background:#dff4e9;border-radius:20px}.detailbar{height:48px;display:flex;align-items:center;padding:0 12px;gap:10px;font-weight:600}.detailbar button{font-size:23px}.detailbar span{flex:1}.hero{padding:14px 18px 18px}.identity{display:flex;gap:15px;align-items:center}.identity .art{width:102px;height:102px;border-radius:15px;flex:none}.identity.artist .art{border-radius:50%}.identity h2{font-size:23px;line-height:1.25;margin:5px 0 8px;letter-spacing:-.5px}.identity .badge{margin-bottom:4px}.desc{font-size:12px;color:#63796e;margin:17px 0 0;line-height:1.8}.desc summary{cursor:pointer;list-style:none}.desc summary:after{content:' 展开⌄';color:var(--g)}.desc[open] summary:after{content:' 收起⌃'}.actions{display:flex;gap:8px;margin-top:17px}.actions button{border-radius:22px;padding:9px 14px;background:white;border:1px solid #dce7df;font-size:12px}.actions .primary{background:var(--g);border-color:var(--g)}.tabs{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #e5ece7;background:var(--bg);position:sticky;top:0;z-index:3;gap:18px;height:49px}.tabs button{padding:12px 0;font-size:13px;white-space:nowrap}.tabs .active{border-bottom:3px solid var(--g);font-weight:600}.tabs select{margin-left:auto;border:0;background:transparent;font-size:11px}.song{display:flex;align-items:center;gap:10px;padding:11px 16px;min-height:71px}.song .art{width:43px;height:43px;border-radius:9px;flex:none}.song .art span{font-size:12px}.song .text{flex:1;min-width:0}.song b{font-size:13px;display:block}.song .num{font-size:11px;width:13px;color:var(--muted)}.song button{font-size:20px;color:var(--muted)}.song.playing{background:#eaf6ef}.song.playing b{color:#07976d}.sectionnote{font-size:10px;color:var(--muted);padding:9px 16px}.toast{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);background:#172b28ed;color:white;padding:9px 15px;border-radius:20px;font-size:12px;white-space:nowrap;z-index:20}.tools{display:flex;gap:8px;align-items:center;margin:18px 0 0;color:var(--muted);font-size:12px}.tools button{border:1px solid #cfddd3;background:white;padding:7px 12px;border-radius:9px}.empty{text-align:center;padding:90px 20px;color:var(--muted)}.empty strong{font-size:28px;display:block;font-weight:400;margin-bottom:12px}@media(max-width:1000px){.layout{grid-template-columns:repeat(2,minmax(0,1fr))}.layout>section:last-child{grid-column:1/-1;max-width:410px;width:100%;justify-self:center}}@media(max-width:650px){.board{padding:18px 10px}.layout{display:block}.layout>section{max-width:430px;margin:0 auto 26px}.phone{height:790px}h1{font-size:20px}.tools{flex-wrap:wrap}}
.detailbar span{flex:none}.detailbar .badge{margin-left:0}.detailbar{gap:9px}.identity>div:last-child{min-width:0}.stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.stat{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid #e5eae7;background:#fafbfa;border-radius:20px;font-size:11px;white-space:nowrap;color:#53665e}.stat svg{width:14px;height:14px;fill:currentColor}.stat.music svg{color:#08b884}.stat.disc svg{color:#3984ed}.desc{background:#f0f2f1;border-radius:12px;padding:12px 13px;margin-top:18px;color:#66766e}.desc summary{line-height:1.8}.desc[open]{line-height:1.9}.identity h2{margin-top:0}.detailbar+.scroll .hero{padding-top:18px}
</style>
<div class="board"><header><h1>搜索、歌手与专辑</h1><p>移动端交互预览 · Mock 数据 · 沿用当前客户端白绿主题</p></header><div class="layout"><section><p class="caption">01 搜索发现<small>切换类型 · 平台筛选 · 点击卡片查看详情</small></p><div class="phone" id="search"></div></section><section><p class="caption">02 歌手详情<small>收藏歌手 · 热门 / 最新 · 歌曲 / 专辑</small></p><div class="phone" id="artist"></div></section><section><p class="caption">03 专辑详情<small>播放全部 · 收藏专辑 · 下载入口</small></p><div class="phone" id="album"></div></section></div><div class="tools"><span>原型状态</span><button onclick="state='normal';renderSearch()">正常结果</button><button onclick="state='empty';renderSearch()">无搜索结果</button><button onclick="state='none';renderSearch()">无可用平台</button><button onclick="state='loading';renderSearch()">加载中</button><span>图片为内置视觉占位，不请求真实接口或下载音频。</span></div></div>
<script>
const colors=['linear-gradient(145deg,#264e57,#10232d)','linear-gradient(145deg,#b4a88d,#536e64)','linear-gradient(145deg,#9085a5,#323c57)','linear-gradient(145deg,#3f6b85,#122c40)','linear-gradient(145deg,#a77f67,#463b36)','linear-gradient(145deg,#627c74,#203e36)'];
const names=['林俊杰','周杰伦','邓紫棋','五月天','孙燕姿','陈奕迅'],aliases=['JJ Lin','Jay Chou','G.E.M.','Mayday','Stefanie Sun','Eason Chan'];
const albums=['和自己对话','新地球','交换余生','黑夜问白天','重拾_快乐','因你而在'];const songs=['Always Online','江南','愿与愁','修炼爱情','可惜没如果','那些你很冒险的梦','不为谁而作的歌','关键词'];let type='歌手',platform='网易',menu=false,state='normal',artistTab='歌曲',artistName='林俊杰',albumIndex=0,playing='',order='热门';const favorites=new Set();
function art(label,index=0){return `<div class="art" style="--cover:${colors[index%colors.length]}"><span>${label}</span></div>`}
function status(){return '<div class="status"><span>9:41</span><span>▂▄▆ · ▰</span></div>'}
function mini(){return `<div class="mini">${art('JJ')}<div class="title"><b>${playing||'Always Online'}</b><div class="muted">林俊杰 · JJ陆</div></div><button aria-label="模拟暂停播放" onclick="toast(this,'原型播放状态已切换')">${playing?'Ⅱ':'▷'}</button><button aria-label="播放队列" onclick="toast(this,'原型队列 · 8 首歌曲')">☷</button></div>`}
function nav(){return '<div class="nav"><button class="selected" onclick="document.querySelector(\'#search\').scrollIntoView({behavior:\'smooth\'})"><i>⌕</i>搜索</button><button onclick="toast(this,\'本轮仅预览搜索功能\')"><i>◉</i>歌单</button><button onclick="toast(this,\'收藏状态已在当前原型中保留\')"><i>♡</i>我的</button></div>'}
function toast(el,msg){const phone=el.closest('.phone');phone.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;phone.append(t);setTimeout(()=>t.remove(),2200)}
function favorite(key,el){favorites.has(key)?favorites.delete(key):favorites.add(key);renderAll()}
function heart(key){return `<button aria-label="${favorites.has(key)?'取消收藏':'收藏'}" class="heart ${favorites.has(key)?'on':''}" onclick="event.stopPropagation();favorite('${key}',this)">${favorites.has(key)?'♥':'♡'}</button>`}
function cards(kind){return `<div class="grid">${(kind==='歌手'?names:albums).map((name,i)=>`<div class="card ${kind==='歌手'?'artist':''}">${heart(kind+i)}<button style="width:100%;padding:0;text-align:inherit" onclick="openDetail('${kind}',${i})">${art(kind==='歌手'?aliases[i].split(' ')[0]:['SELF','GENESIS','余生','NIGHT','HAPPY','STORIES'][i],i)}<b>${name}</b><div class="muted">${kind==='歌手'?aliases[i]:'林俊杰'}</div><div class="meta"><span class="badge">${platform}</span>${kind==='歌手'?[74,65,58,66,32,49][i]+' 张专辑':['2015.12.25','2014.12.27','2020.09.16','2017.12.26','2023.04.21','2013.03.13'][i]}</div></button></div>`).join('')}</div>`}
function rows(){return songs.map((name,i)=>`<div class="song ${playing===name?'playing':''}"><span class="num">${i+1}</span><button style="padding:0" onclick="play('${name}')" aria-label="播放 ${name}">${art(['JJ','江南','愿与愁','修炼'][i%4],i)}</button><div class="text"><b>${name}</b><span class="muted">${artistName} · ${i===0?'JJ陆':albums[i%6]}</span><div><span class="badge">${platform}</span><span class="muted">无损</span></div></div><button aria-label="歌曲菜单" onclick="toast(this,'原型 · 下一首播放 / 收藏到歌单 / 下载')">⋮</button></div>`).join('')}
function play(name){playing=name;renderAll()}
function setType(value){type=value;menu=false;state='normal';if(type!=='歌曲'&&!['网易','QQ'].includes(platform))platform='网易';renderSearch()}
function renderSearch(){document.querySelector('#search').innerHTML=status()+`<div class="top"><form class="search" onsubmit="event.preventDefault();state=this.q.value.trim()?'normal':'empty';renderSearch()"><span>⌕</span><input name="q" aria-label="搜索关键词" value="林俊杰"><button aria-label="搜索" type="submit">→</button></form><div class="kind"><button aria-expanded="${menu}" onclick="menu=!menu;renderSearch()">${type} ⌄</button>${menu?`<div class="menu">${['歌曲','歌手','专辑'].map(t=>`<button class="${type===t?'active':''}" onclick="setType('${t}')">${t}${type===t?'　✓':''}</button>`).join('')}</div>`:''}</div></div><div class="scroll"><div class="platforms">${(type==='歌曲'?['网易','QQ','酷狗','酷我','咪咕']:['网易','QQ']).map(p=>`<button class="${p===platform?'active':''}" onclick="platform='${p}';state='normal';renderAll()">${p}</button>`).join('')}</div>${state==='normal'?`<div class="count">${type==='歌曲'?'已加载 8 首':'找到 6 '+(type==='歌手'?'位歌手':'张专辑')}</div>${type==='歌曲'?rows():cards(type)}`:`<div class="empty"><strong>${state==='loading'?'◌':'⌕'}</strong>${state==='none'?'暂无支持此搜索类型的可用平台':state==='loading'?'正在搜索…':'没有找到相关'+type}<p style="font-size:12px">${state==='none'?'可切回歌曲搜索，或检查账号音源配置':state==='loading'?'原型加载状态':'试试其他关键词或平台'}</p><button class="primary" onclick="${state==='none'?"setType('歌曲')":"state='normal';renderSearch()"}">${state==='none'?'搜索歌曲':'返回结果'}</button></div>`}</div>`+mini()+nav()}
function openDetail(kind,i){if(kind==='歌手'){artistName=names[i];renderArtist();document.querySelector('#artist').scrollIntoView({behavior:'smooth',block:'center'})}else{albumIndex=i;renderAlbum();document.querySelector('#album').scrollIntoView({behavior:'smooth',block:'center'})}}
function renderArtist(){const key='歌手'+Math.max(0,names.indexOf(artistName));document.querySelector('#artist').innerHTML=status()+`<div class="detailbar"><button aria-label="返回搜索" onclick="document.querySelector('#search').scrollIntoView({behavior:'smooth'})">‹</button><span>歌手详情</span><span class="badge">${platform}</span></div><div class="scroll"><div class="hero"><div class="identity artist">${art(aliases[Math.max(0,names.indexOf(artistName))].split(' ')[0])}<div><h2>${artistName}</h2><div class="stats"><span class="stat music"><span style="color:#08b884">♫</span>599 歌曲</span><span class="stat disc"><span style="color:#3984ed">◉</span>85 专辑</span></div></div></div><details class="desc"><summary>用旋律记录生活，用声音传递心情。</summary>这里展示服务端返回的歌手简介。当前文字与数量均为原型示例，正式版缺失字段不补造。</details><div class="actions"><button class="primary" onclick="play('Always Online')">▶ 播放全部</button><button onclick="favorite('${key}',this)">${favorites.has(key)?'♥ 已收藏':'♡ 收藏歌手'}</button></div></div><div class="tabs"><button class="${artistTab==='歌曲'?'active':''}" onclick="artistTab='歌曲';renderArtist()">歌曲</button><button class="${artistTab==='专辑'?'active':''}" onclick="artistTab='专辑';renderArtist()">专辑</button>${artistTab==='歌曲'?`<select aria-label="歌曲排序" onchange="order=this.value;renderArtist()"><option ${order==='热门'?'selected':''}>热门</option><option ${order==='最新'?'selected':''}>最新</option></select>`:''}</div>${artistTab==='歌曲'?`<div class="sectionnote">${order}歌曲 · 已加载 8 首</div>${order==='热门'?rows():rows().split('</div></div>').join('</div></div>')}`:`<div style="height:14px"></div>${cards('专辑')}`}</div>`+mini()}
function renderAlbum(){const i=albumIndex,key='专辑'+i;document.querySelector('#album').innerHTML=status()+`<div class="detailbar"><button aria-label="返回搜索" onclick="document.querySelector('#search').scrollIntoView({behavior:'smooth'})">‹</button><span>专辑详情</span><span class="badge">${platform}</span></div><div class="scroll"><div class="hero"><div class="identity">${art(['SELF','GENESIS','余生','NIGHT','HAPPY','STORIES'][i],i)}<div><h2>${albums[i]}</h2><button style="padding:0;color:#07976d;font-size:12px" onclick="artistName='林俊杰';renderArtist();document.querySelector('#artist').scrollIntoView({behavior:'smooth'})">林俊杰</button></div></div><div class="meta">2015.12.25 发行 · 8 首歌曲</div><details class="desc"><summary>在音乐里，听见另一个自己。</summary>专辑简介示例。正式版将按接口返回展示发行日期、歌曲数量和简介。</details><div class="actions"><button class="primary" onclick="play('Always Online')">▶ 播放全部</button><button onclick="favorite('${key}',this)">${favorites.has(key)?'♥ 已收藏':'♡ 收藏'}</button><button onclick="toast(this,'原型演示 · 下载专辑需确认，未创建下载任务')">↓ 下载</button></div></div><div class="tabs"><button class="active">歌曲 · 8</button><button style="margin-left:auto" onclick="toast(this,'原型 · 批量选择歌曲')">多选</button></div>${rows()}</div>`+mini()}
function renderAll(){renderSearch();renderArtist();renderAlbum()}renderAll();
</script></html>
