<style>
:root{--green:#08b884;--ink:#172b28;--muted:#7c8d87;--canvas:#f7faf8;--line:#e1ebe5}
*{box-sizing:border-box}body{margin:0;background:#edf3ef;color:var(--ink);font:14px/1.45 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.35}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}button{border:0;background:none;color:inherit}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.board{max-width:1180px;margin:auto;padding:30px 32px 24px}.intro{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:2px;color:#658177;margin-bottom:5px}h1{font-size:25px;letter-spacing:-.6px;margin:0;font-weight:650}.sub{color:var(--muted);font-size:12px;margin-top:5px}.controls{display:flex;align-items:center;gap:10px}.switch{display:flex;background:#dfe9e3;padding:3px;border-radius:10px}.switch button{padding:7px 12px;font-size:12px;border-radius:8px;white-space:nowrap}.switch button.active{background:white;box-shadow:0 1px 5px #183c2410;color:#087653}.controls select{background:#fff;border:1px solid #d8e4dc;border-radius:9px;padding:8px;color:#476056;font-size:12px}.columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}.caption{height:64px;padding:0 3px}.caption b{font-size:14px;font-weight:600}.caption .number{font-size:10px;color:var(--green);margin-right:7px}.caption p{margin:5px 0 0;font-size:12px;color:var(--muted)}.phone{height:690px;position:relative;overflow:hidden;background:var(--canvas);border:1px solid #d8e3dc;border-radius:25px;box-shadow:0 12px 32px #193a2510;display:flex;flex-direction:column}.status{height:29px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:10px;font-weight:650;flex:none}.status-right{display:flex;gap:5px;align-items:center;font-size:9px}.battery{width:17px;height:8px;border:1px solid #4d625a;border-radius:2px;position:relative}.battery:before{content:'';position:absolute;background:#4d625a;inset:1px 4px 1px 1px;border-radius:1px}.top{height:52px;display:flex;gap:10px;align-items:center;padding:4px 14px;flex:none}.search{height:36px;display:flex;align-items:center;gap:9px;background:#fff;border-radius:22px;padding:0 12px;flex:1;min-width:0;font-size:13px}.search svg{width:18px;height:18px;color:#4c6157}.search span{flex:1}.avatar{background:#e0f3e9;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;color:var(--green);font-weight:650}.platforms{height:43px;display:flex;gap:6px;padding:4px 14px 7px;flex:none}.platforms button{flex:1;min-width:0;padding:3px 0;border:1px solid #c6d5cc;border-radius:9px;font-size:12px;background:white;white-space:nowrap}.platforms button.selected{background:#d5eee2;border-color:#d5eee2;color:#175e47;font-weight:550}.context{height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:11px;color:var(--muted)}.context .category{color:#119775;display:flex;align-items:center;gap:6px}.context svg{width:14px;height:14px}.context select{border:0;background:transparent;color:var(--ink);font-size:11px}.results{min-height:0;overflow:auto;flex:1;scrollbar-width:none;overscroll-behavior:contain}.results::-webkit-scrollbar{display:none}.item{display:flex;align-items:center;gap:10px;padding:9px 15px;min-height:64px}.art{height:43px;width:43px;border-radius:9px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;background:linear-gradient(150deg,var(--a),var(--b));color:#ffffffdc}.art:before{content:'';position:absolute;border-radius:50%;width:58px;height:58px;background:#ffffff19;left:14px;top:19px}.art:after{content:'';position:absolute;border-radius:50%;width:24px;height:24px;background:#ffffff20;left:-7px;top:-3px}.art svg{width:20px;height:20px;position:relative}.item-main{min-width:0;flex:1}.title{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}.meta{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden}.badge{border:1px solid #b1e7d1;color:#06865e;background:#d9f6e8;border-radius:3px;padding:0 3px;font-size:8px;line-height:13px}.badge.wy{background:#ffe8ec;border-color:#f9c8d4;color:#bf3257}.quality{background:#eee7ff;border-color:#d9c9fb;color:#8154c8}.more{width:21px;height:30px;padding:0;color:#91a198;display:grid;place-items:center}.more svg{width:17px}.load-more{display:block;margin:5px auto 12px;color:var(--green);font-size:11px;padding:8px 12px}.pager{height:32px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:1px;flex:none;background:var(--canvas)}.pager button{height:31px;min-width:31px;display:grid;place-items:center;padding:0 5px}.pager svg{width:18px;height:18px}.page-label{font-size:11px;color:#6c8377;min-width:88px;text-align:center}.pager .jump{font-size:10px;color:#0b9b71;min-width:35px;margin-left:8px}.mini{height:61px;margin:0 14px;border:1px solid var(--line);border-radius:17px;background:#fff;display:flex;align-items:center;gap:9px;padding:7px 9px;flex:none}.mini .art{width:39px;height:39px;border-radius:9px}.mini .title{font-size:12px;margin-bottom:2px}.mini .meta{font-size:10px}.play{height:33px;width:33px;background:var(--green);border-radius:50%;color:white;display:grid;place-items:center;flex:none}.play svg{width:18px;fill:currentColor;stroke:none}.queue{color:#4d6257;padding:0 0 0 4px}.queue svg{width:21px}.nav{height:55px;padding:7px 12px 4px;display:flex;justify-content:space-around;flex:none}.nav button{font-size:9px;color:#8a9a91;min-width:52px;display:flex;align-items:center;flex-direction:column;gap:2px}.nav svg{height:19px;width:19px}.nav .active{color:#1a5841}.nav .active svg{background:#dff2e8;border-radius:12px;box-sizing:content-box;padding:2px 12px;margin:-2px -12px}.home-line{height:3px;width:86px;background:#a5b6ad;border-radius:3px;margin:0 auto 6px;flex:none}.veil{position:absolute;inset:0;background:#122d2252;z-index:3;display:flex;align-items:flex-end}.sheet{background:white;width:100%;border-radius:21px 21px 0 0;padding:8px 18px 16px;box-shadow:0 -5px 25px #193c1d12}.grab{width:28px;height:3px;background:#d3ded7;border-radius:3px;margin:0 auto 13px}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}.sheet-head b{font-size:16px;font-weight:650}.cancel{font-size:12px;color:var(--muted);padding:5px 0 5px 12px}.sheet-sub{color:var(--muted);font-size:11px;margin-bottom:13px}.sheet-tabs{display:flex;border-bottom:1px solid #edf2ee;gap:23px}.sheet-tabs button{font-size:12px;color:var(--muted);padding:7px 0 9px;position:relative}.sheet-tabs .active{color:#07966a;font-weight:600}.sheet-tabs .active:after{content:'';position:absolute;height:2px;background:var(--green);bottom:0;left:0;right:0;border-radius:2px}.wheel-wrap{height:180px;position:relative;margin:5px 0 7px}.wheel{height:180px;overflow:auto;padding:72px 0;scroll-snap-type:y mandatory;scrollbar-width:none;mask-image:linear-gradient(transparent,#000 24%,#000 76%,transparent)}.wheel::-webkit-scrollbar{display:none}.wheel button{height:36px;scroll-snap-align:center;display:block;width:100%;font-size:20px;color:#b2c0b8;padding:0}.wheel button.selected{color:#079b70;font-weight:600;font-size:25px}.wheel-bar{position:absolute;top:72px;left:0;right:0;height:36px;background:#eaf8f0;border-radius:8px;pointer-events:none}.wheel{position:relative}.wheel-unit{font-size:11px;margin-left:5px;font-weight:400}.input-pane{height:192px;padding-top:24px}.number-field{display:flex;align-items:center;border:1px solid #b3d9c6;border-radius:10px;overflow:hidden}.number-field input{min-width:0;width:100%;border:0;outline:0;padding:11px 12px;color:var(--ink);font-size:20px;background:#fbfefc}.number-field span{font-size:12px;color:var(--muted);padding-right:13px}.error{color:#c34460;font-size:11px;min-height:21px;margin-top:8px}.confirm{height:39px;width:100%;background:var(--green);color:white;border-radius:11px;font-size:13px;font-weight:550}.sheet-footer{height:3px;width:80px;background:#d5ded8;margin:12px auto -7px;border-radius:4px}.detail-top{display:flex;align-items:center;gap:12px;padding:11px 15px 13px;background:linear-gradient(var(--canvas),#fff)}.detail-top .art{width:63px;height:63px;border-radius:12px}.detail-top .title{font-size:16px;margin-bottom:6px}.detail-top .meta{margin-bottom:4px}.detail-nav{height:43px;display:flex;align-items:center;justify-content:space-between;padding:0 15px}.detail-nav button{padding:0}.detail-nav span{font-size:13px}.detail-toolbar{height:37px;background:white;display:flex;align-items:center;padding:0 15px;gap:7px;font-size:12px}.detail-toolbar .play{width:25px;height:25px}.detail-toolbar .count{color:var(--muted);font-size:10px;flex:1}.detail-toolbar svg{height:18px}.board-note{margin-top:18px;text-align:center;color:#7e9387;font-size:11px}#verification{display:none}[hidden]{display:none!important}
@media(max-width:950px){.board{padding:22px 18px}.intro{align-items:flex-start;flex-direction:column;gap:14px}.columns{overflow-x:auto;grid-template-columns:repeat(3,320px);padding-bottom:15px;gap:18px}.phone{height:680px}.controls{flex-wrap:wrap}.board-note{text-align:left}}
</style>
</head>
<body>
<main class="board">
  <header class="intro"><div><div class="eyebrow">LXSERVER MOBILE · DESIGN PREVIEW</div><h1>浏览与分页</h1><div class="sub">交互原型 · 仅示例数据，未接入真实接口</div></div>
    <div class="controls"><div class="switch" aria-label="切换页面类型"><button data-mode="songs" class="active">歌曲搜索</button><button data-mode="playlists">公共歌单</button><button data-mode="detail">歌单内歌曲</button></div><select id="page-size" aria-label="每页数量"><option value="10">每页 10 项</option><option value="20" selected>每页 20 项</option><option value="30">每页 30 项</option></select></div>
  </header>
  <section class="columns">
    <article><div class="caption"><b><span class="number">01</span><span id="single-title">单平台 · 按总数分页</span></b><p id="single-note">32px 分页栏，下方不再额外留白</p></div><div class="phone" id="phone-0"></div></article>
    <article><div class="caption"><b><span class="number">02</span>跳转页码</b><p>输入或滚动选择，确认后跳转</p></div><div class="phone" id="phone-1"></div></article>
    <article><div class="caption"><b><span class="number">03</span><span id="continuous-title">聚合 · 连续浏览</span></b><p id="continuous-note">未选平台，向下浏览，不显示分页栏</p></div><div class="phone" id="phone-2"></div></article>
  </section>
  <footer class="board-note">可点击平台、上一页 / 下一页和“跳页”。上方可切换三类页面；所有数量均为演示。</footer>
  <output id="verification"></output>
</main>
<script>
const paths={search:'<circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/>',left:'<path d="m14 5-7 7 7 7"/>',right:'<path d="m9 5 7 7-7 7"/>',arrow:'<path d="M4 12h15m-6-6 6 6-6 6"/>',play:'<path d="m8 4 12 8-12 8z"/>',music:'<path d="M9 18V5l10-2v12M9 8l10-2"/><ellipse cx="6" cy="18" rx="3" ry="2.5"/><ellipse cx="16" cy="15" rx="3" ry="2.5"/>',queue:'<path d="M3 5h14M3 11h10M3 17h7m7-7v9m0-9 4-1"/><ellipse cx="15" cy="19" rx="2" ry="1.5"/>',more:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',explore:'<circle cx="12" cy="12" r="9"/><path d="m16 8-3 5-5 3 3-5z"/>',library:'<path d="M4 5v16h15M8 2h13v15H8zM12 7h5m-5 4h5"/>',tune:'<path d="M3 6h18M3 17h18M8 3v6m8 5v6"/>',edit:'<path d="M3 5h17M3 11h11M3 17h8m4 1 3 3 5-6"/>'};
const icon=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.music}</svg>`;
const sources=['网易','QQ','酷狗','酷我','咪咕'];
const titles=['把夜晚留给风','日落之后','微光来信','沿途的风景','慢慢靠近','留一盏灯','雨停的时候','向海走去','昨日的回声','穿过夏天'];
const authors=['林间','远山乐队','小岛','向北','白昼旅行'];
const listTitles=['晚风与慢拍 · 下班路上的歌','给今天一点节奏','安静听完这一场日落','周末散步，带上耳机','在城市里收集微光','旋律与海，刚好相遇'];
const colors=[['#d6a580','#76606c'],['#577e75','#233e4e'],['#8d91b5','#d9b4a6'],['#789dae','#d5d4a7'],['#c29a84','#7d855e'],['#7b8c9c','#b5c4bb']];
let mode='songs',size=20;
const states=[{source:0,page:1,open:false,draft:1,inputMode:false,loaded:18},{source:0,page:8,open:true,draft:12,inputMode:false,loaded:18},{source:null,page:1,open:false,draft:1,inputMode:false,loaded:18}];
const total=()=>mode==='playlists'?246:mode==='detail'?243:620;
const count=()=>Math.ceil(total()/size);
const art=(i)=>{const c=colors[i%colors.length];return `<div class="art" style="--a:${c[0]};--b:${c[1]}">${icon('music')}</div>`};
function rows(i){const s=states[i],continuous=mode==='detail'?i===2:s.source===null;const start=continuous?0:(s.page-1)*size;const length=continuous?s.loaded:Math.min(size,total()-start);let html='';for(let n=0;n<length;n++){const at=start+n;const src=mode==='detail'?'网易':s.source===null?sources[at%5]:sources[s.source];if(mode==='playlists'){html+=`<div class="item">${art(at)}<div class="item-main"><div class="title">${listTitles[at%listTitles.length]}</div><div class="meta">${s.source===null?src+' · ':''}${authors[at%5]} · ${(1.2+at*.1).toFixed(1)}万次播放</div></div></div>`}else{html+=`<div class="item">${art(at)}<div class="item-main"><div class="title">${titles[at%10]}</div><div class="meta"><span class="badge ${src==='网易'?'wy':''}">${src}</span><span class="badge quality">无损</span><span>${authors[at%5]} · ${titles[(at+2)%10]}</span></div></div><button class="more" aria-label="歌曲操作">${icon('more')}</button></div>`}}
if(continuous)html+=`<button class="load-more" onclick="loadMore(${i})">继续加载</button>`;return html}
function sheet(i){const s=states[i];if(!s.open)return '';const pages=count();return `<div class="veil" onclick="if(event.target===this)closeSheet(${i})"><section class="sheet" role="dialog" aria-modal="true" aria-label="跳转页码"><div class="grab"></div><div class="sheet-head"><b>跳转页码</b><button class="cancel" onclick="closeSheet(${i})">取消</button></div><div class="sheet-sub">当前第 ${s.page} 页，共 ${pages} 页</div><div class="sheet-tabs"><button class="${s.inputMode?'active':''}" onclick="switchInput(${i},true)">输入页码</button><button class="${s.inputMode?'':'active'}" onclick="switchInput(${i},false)">滚动选择</button></div>${s.inputMode?`<div class="input-pane"><div class="number-field"><input aria-label="目标页码" inputmode="numeric" value="${s.draft}" oninput="validateInput(${i},this)" onkeydown="if(event.key==='Enter')confirmJump(${i})"><span>页</span></div><div class="error" id="error-${i}"></div></div>`:`<div class="wheel-wrap"><div class="wheel-bar"></div><div class="wheel" role="listbox" aria-label="页码" onscroll="wheelScroll(${i},this)">${Array.from({length:pages},(_,n)=>`<button role="option" aria-selected="${n+1===s.draft}" class="${n+1===s.draft?'selected':''}" onclick="chooseWheel(${i},${n+1})">${n+1}<span class="wheel-unit">页</span></button>`).join('')}</div></div>`}<button class="confirm" onclick="confirmJump(${i})">跳转至第 ${s.draft} 页</button><div class="sheet-footer"></div></section></div>`}
function render(i){const s=states[i];s.page=Math.max(1,Math.min(s.page,count()));s.draft=Math.max(1,Math.min(s.draft,count()));const continuous=mode==='detail'?i===2:s.source===null;let top='';if(mode==='detail'){top=`<div class="detail-nav"><button aria-label="返回">${icon('left')}</button><span>晚风收藏夹</span><button aria-label="歌单搜索">${icon('search')}</button></div><div class="detail-top">${art(1)}<div><div class="title">晚风收藏夹</div><div class="meta">来自网易</div><div class="meta">把喜欢的旋律留在这里</div></div></div><div class="detail-toolbar"><button class="play" aria-label="播放全部">${icon('play')}</button><b>播放全部</b><span class="count">${total()} 首</span>${icon('edit')}</div>`}else{top=`<div class="top"><div class="search">${icon('search')}<span>${mode==='songs'?'晚风':'通勤歌单'}</span>${icon('arrow')}</div><div class="avatar">I</div></div><div class="platforms" aria-label="平台选择">${sources.map((v,n)=>`<button class="${s.source===n?'selected':''}" aria-pressed="${s.source===n}" onclick="selectSource(${i},${n})">${v}</button>`).join('')}</div><div class="context">${mode==='playlists'&&!continuous?`<span class="category">${icon('tune')} 全部分类</span><select aria-label="歌单排序"><option>推荐</option><option>最新</option></select>`:`<span>${continuous?'已加载 '+s.loaded:total()} ${mode==='songs'?'首歌曲':'个歌单'}</span>`}</div>`}
document.getElementById('phone-'+i).innerHTML=`<div class="status"><span>9:41</span><div class="status-right">5G ▴▴▴ <span class="battery"></span></div></div>${top}<div class="results">${rows(i)}</div>${!continuous?`<div class="pager" aria-label="分页"><button aria-label="上一页" ${s.page===1?'disabled':''} onclick="turn(${i},-1)">${icon('left')}</button><span class="page-label">第 ${s.page} / ${count()} 页</span><button aria-label="下一页" ${s.page===count()?'disabled':''} onclick="turn(${i},1)">${icon('right')}</button><button class="jump" aria-label="跳转页码" onclick="openSheet(${i})">跳页</button></div>`:''}<div class="mini">${art(3)}<div class="item-main"><div class="title">日落之后</div><div class="meta">远山乐队</div></div><button class="play" aria-label="播放" onclick="this.innerHTML=this.dataset.playing?icon('play'):'Ⅱ';this.dataset.playing=this.dataset.playing?'':'1'">${icon('play')}</button><button class="queue" aria-label="播放队列">${icon('queue')}</button></div><nav class="nav"><button class="${mode==='songs'?'active':''}" onclick="setMode('songs')">${icon('search')}搜索</button><button class="${mode==='playlists'?'active':''}" onclick="setMode('playlists')">${icon('explore')}歌单</button><button class="${mode==='detail'?'active':''}" onclick="setMode('detail')">${icon('library')}我的</button></nav><div class="home-line"></div>${sheet(i)}`;
const wheel=document.querySelector('#phone-'+i+' .wheel');if(wheel)wheel.scrollTop=(s.draft-1)*36;
if(i===0){document.getElementById('single-title').textContent=continuous?'聚合 · 连续浏览':'单平台 · 按总数分页';document.getElementById('single-note').textContent=continuous?'取消平台选择，不显示分页栏':'32px 分页栏，下方不再额外留白'}
if(i===2){document.getElementById('continuous-title').textContent=mode==='detail'?'连续列表':continuous?'聚合 · 连续浏览':'单平台 · 按总数分页';document.getElementById('continuous-note').textContent=mode==='detail'?'关闭分页时，歌单内仍可连续浏览':continuous?'未选平台，向下浏览，不显示分页栏':'选定平台显示分页，再次点击可取消'}
}
function renderAll(){states.forEach((_,i)=>render(i));document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
function setMode(value){mode=value;states.forEach((s,i)=>{s.page=i===1?Math.min(8,count()):1;s.draft=Math.min(i===1?12:1,count());s.loaded=18});renderAll()}
function selectSource(i,value){const s=states[i];s.source=s.source===value?null:value;s.page=1;s.open=false;render(i)}
function turn(i,delta){states[i].page=Math.max(1,Math.min(count(),states[i].page+delta));render(i)}
function openSheet(i){const s=states[i];s.open=true;s.draft=s.page;s.inputMode=false;render(i)}
function closeSheet(i){states[i].open=false;render(i);document.querySelector('#phone-'+i+' .jump')?.focus()}
function switchInput(i,value){states[i].inputMode=value;render(i);if(value){const field=document.querySelector('#phone-'+i+' input');field.focus();field.select()}}
function chooseWheel(i,value){const wheel=document.querySelector('#phone-'+i+' .wheel');wheel.scrollTo({top:(value-1)*36,behavior:'smooth'})}
function wheelScroll(i,wheel){const value=Math.max(1,Math.min(count(),Math.round(wheel.scrollTop/36)+1));states[i].draft=value;wheel.querySelectorAll('button').forEach((b,n)=>{b.classList.toggle('selected',n+1===value);b.setAttribute('aria-selected',n+1===value)});const confirm=document.querySelector('#phone-'+i+' .confirm');confirm.textContent='跳转至第 '+value+' 页';confirm.disabled=false}
function validateInput(i,field){const valid=/^\d+$/.test(field.value)&&Number(field.value)>=1&&Number(field.value)<=count();states[i].draft=valid?Number(field.value):null;document.getElementById('error-'+i).textContent=valid?'':'请输入 1 至 '+count()+' 的整数';const confirm=document.querySelector('#phone-'+i+' .confirm');confirm.disabled=!valid;confirm.textContent=valid?'跳转至第 '+states[i].draft+' 页':'跳转'}
function confirmJump(i){const s=states[i];if(!Number.isInteger(s.draft)||s.draft<1||s.draft>count())return;s.page=s.draft;s.open=false;render(i)}
function loadMore(i){const area=document.querySelector('#phone-'+i+' .results'),at=area.scrollTop;states[i].loaded+=12;render(i);document.querySelector('#phone-'+i+' .results').scrollTop=at}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.getElementById('page-size').onchange=e=>{size=Number(e.target.value);states.forEach(s=>{s.page=1;s.draft=1});renderAll()};document.addEventListener('keydown',e=>{if(e.key==='Escape')states.forEach((s,i)=>{if(s.open)closeSheet(i)})});renderAll();
</script>
</body>
</html>
