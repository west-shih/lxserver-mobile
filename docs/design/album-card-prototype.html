.card{padding:0;overflow:hidden;border:1px solid #e1ebe5;border-radius:12px;box-shadow:0 2px 6px #183a2505}
.cover{border-radius:0;position:relative;cursor:default;isolation:isolate}
.cover:after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#10231b14,transparent 40%,#10231b10)}
.cover-actions{display:flex;gap:5px;position:absolute;top:8px;right:8px}
.cover-actions button{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;padding:0;color:white;background:#13291d70;backdrop-filter:blur(8px);margin:0}
.cover-actions svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cover-actions .save[aria-pressed=true]{background:#e94f73e8;color:white}

.play-cover{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:39px;height:39px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--green);color:white;box-shadow:0 3px 12px #002f1b26}

<div class="board"><h1>专辑卡片 · 版式预览</h1><p class="intro">封面贴合卡片轮廓 · 内侧圆形操作 · 平台与歌手同一行</p><div class="phones"><section><div class="label">01 搜索专辑</div><div class="phone" id="searchPhone"><div class="status"><span>9:41</span><span>▂▄▆ · ▰</span></div><div class="top"><form class="searchbox" onsubmit="event.preventDefault();toast(this,'当前为 Mock 搜索预览')"><span>⌕</span><input aria-label="关键词" value="王力宏"><button aria-label="搜索">→</button></form><button class="kind" onclick="toast(this,'当前预览专辑卡片')">专辑 ⌄</button></div><div class="scroll"><div class="platforms"><button onclick="setSource(this,'网易')">网易</button><button class="active" onclick="setSource(this,'QQ')">QQ</button></div><div class="count">已加载 4 张专辑</div><div class="grid" id="searchGrid"></div></div><div class="nav"><button class="active" onclick="toast(this,'搜索专辑')"><span>⌕</span>搜索</button><button onclick="toast(this,'仅预览专辑卡片')"><span>◉</span>歌单</button><button onclick="toast(this,'收藏状态仅保留在当前原型')"><span>♡</span>我的</button></div></div></section><section><div class="label">02 歌手的专辑列表</div><div class="phone" id="artistPhone"><div class="status"><span>9:41</span><span>▂▄▆ · ▰</span></div><div class="detailnav"><button class="back" aria-label="返回" onclick="toast(this,'当前为卡片版式预览')">‹</button><b>歌手详情</b><span class="badge">QQ</span><span class="spacer"></span><button class="save" aria-label="收藏歌手" aria-pressed="true" onclick="toggle(this)"><svg viewBox="0 0 24 24"><path d="M20.5 4.5a5 5 0 0 0-7 0L12 6l-1.5-1.5a5 5 0 0 0-7 7L12 20l8.5-8.5a5 5 0 0 0 0-7Z"/></svg></button></div><div class="scroll"><div class="hero"><div class="avatar">LH</div><div><h2>王力宏</h2><div class="stats"><span><i>◉</i>43 专辑</span><span><i>♫</i>1013 歌曲</span></div></div></div><div class="tabs"><button onclick="toast(this,'当前仅展示专辑卡片')">歌曲</button><button class="active" onclick="toast(this,'专辑列表')">专辑</button></div><div class="grid" id="artistGrid"></div></div></div></section></div><p class="note"><b>点击爱心切换收藏状态。</b>粉色实心代表已收藏，白色空心代表未收藏。播放为交互演示。封面取自你提供的截图， <script>
const albums=[['心中的日月','2004-12-31',false],['不可思议','2003-10-15',true],['心中的日月（纪念版）','',false],['不可思议 · Unbelievable','',false]];
function card(item,i,saved){return `<article class="card"><div role="group" aria-label="${item[0]}封面与操作" class="cover ${i%2?'second':''}"><div class="cover-actions"><button class="save" aria-label="收藏${item[0]}" aria-pressed="${saved}" onclick="toggle(this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 4.5a5 5 0 0 0-7 0L12 6l-1.5-1.5a5 5 0 0 0-7 7L12 20l8.5-8.5a5 5 0 0 0 0-7Z"/></svg></button></div><button class="play-cover" aria-label="播放${item[0]}" onclick="toast(this,'播放专辑 · 原型演示')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8Z"/></svg></button></div><div class="caption"><button class="album-name" onclick="toast(this,'专辑详情沿用现有布局')">${item[0]}</button></div><div class="credits"><span class="badge">QQ</span><span class="singer">王力宏</span></div><div class="date">${item[1]}</div></article>`}

document.querySelector('#searchGrid').innerHTML=albums.map((a,i)=>card(a,i,a[2])).join('');document.querySelector('#artistGrid').innerHTML=albums.map((a,i)=>card(a,i,i===0)).join('');
function toggle(button){let saved=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(saved));toast(button,saved?'已收藏 · 原型演示':'已取消收藏 · 原型演示')}
function toast(el,message){const phone=el.closest('.phone');phone.querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.textContent=message;phone.append(t);setTimeout(()=>t.remove(),1800)}
function setSource(el,label){el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===el));el.closest('.phone').querySelectorAll('.credits .badge').forEach(b=>{b.textContent=label;b.classList.toggle('wy',label==='网易')})}
</script></html>
